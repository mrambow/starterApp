<ion-app>
  <ion-split-pane contentId="main-content" when="never">
    <ion-menu contentId="main-content" type="overlay" aria-label="Navigation">
      <ion-content>
        <ion-menu-toggle>
          <ion-button>Click to close the menu</ion-button>
        </ion-menu-toggle>
        <ion-list id="repro-list">
          <ion-list-header>Ionic a11y repros</ion-list-header>
          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
            <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
